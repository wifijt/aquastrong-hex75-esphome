# ============================================================================
# TEMPORARY register survey overlay — flash, capture, flash back
# ----------------------------------------------------------------------------
# Sweeps the register ranges that have never been surveyed on this controller
# and logs every value every 30s, so you can watch which ones MOVE as the unit
# changes state. A static dump tells you almost nothing; a register that
# changes when the compressor starts, when a fault trips, or during a defrost
# cycle is the whole point.
#
# WHY THESE RANGES
#   0-59    Reg 29 (flow/fault status) sits alone in an otherwise unexamined
#           neighbourhood. On these OEM boards the fault-code block is almost
#           always contiguous with the status word, so 0-28 and 30-59 are the
#           highest-probability location for the undecoded E-codes.
#   786-800 Immediately past the 785 state echo, at the top of the control
#           block. Second-most-likely spot for mode/state flags.
#
# HOW TO USE
#   1. Copy this file and config/pool-heatpump.yaml into your ESPHome config
#      directory (they must sit side by side).
#   2. Install THIS file. It pulls the production config in as a package, so
#      every normal entity, control and safety behaviour stays live — you do
#      not lose control of the heater while surveying.
#   3. Open the log stream and leave it running. Capture, at minimum:
#        - several minutes with the unit OFF
#        - the compressor start transition
#        - steady-state running
#        - the shutdown transition
#      If you ever catch a fault or a defrost cycle, that capture is gold.
#   4. Re-install config/pool-heatpump.yaml to return to normal.
#
# COST
#   Three extra Modbus frames every 30s, against a 5s poll cycle that already
#   uses five. Negligible, but this is deliberately NOT in the production
#   config — surveying unmapped registers is a diagnostic activity, not
#   something to run forever on the device that controls your heater.
#
# A WARNING ABOUT UNMAPPED REGISTERS
#   Registers the controller does not implement may return a Modbus exception
#   rather than zeros. ESPHome logs those as errors and the range is skipped.
#   That is informative in itself — an exception means "no register here",
#   while a zero means "register exists, currently zero". If a whole range
#   throws exceptions, drop it from SURVEY_RANGES below rather than letting it
#   retry every 30s.
# ============================================================================

packages:
  base: !include pool-heatpump.yaml

esphome:
  name_add_mac_suffix: false

logger:
  level: INFO
  logs:
    survey: INFO
    modbus_controller: WARN

interval:
  - interval: 30s
    then:
      - lambda: |-
          // Ranges to sweep: {first register, how many}. Modbus allows up to
          // 125 registers per read, but keeping chunks small means one bad
          // range does not blind the others.
          struct SurveyRange { uint16_t start; uint16_t count; };
          static const SurveyRange SURVEY_RANGES[] = {
            {0,   30},
            {30,  30},
            {786, 15},
          };

          static uint32_t sweep = 0;
          sweep++;

          for (auto &r : SURVEY_RANGES) {
            auto handler = [](esphome::modbus_controller::ModbusRegisterType,
                              uint16_t start_address,
                              const std::vector<uint8_t> &data) {
              // Response payload is big-endian 16-bit words. Emit compact
              // "addr=value" pairs, skipping zeros so the interesting values
              // are not buried — a fully zero range prints as "(all zero)".
              std::string line;
              char buf[24];
              size_t nonzero = 0;
              for (size_t i = 0; i + 1 < data.size(); i += 2) {
                uint16_t v = (uint16_t(data[i]) << 8) | uint16_t(data[i + 1]);
                if (v == 0) continue;
                nonzero++;
                snprintf(buf, sizeof(buf), "%u=%u ",
                         (unsigned) (start_address + i / 2), (unsigned) v);
                line += buf;
              }
              if (nonzero == 0) {
                ESP_LOGI("survey", "[%u..%u] (all zero)",
                         (unsigned) start_address,
                         (unsigned) (start_address + data.size() / 2 - 1));
              } else {
                ESP_LOGI("survey", "[%u..%u] %s",
                         (unsigned) start_address,
                         (unsigned) (start_address + data.size() / 2 - 1),
                         line.c_str());
              }
            };

            auto cmd = esphome::modbus_controller::ModbusCommandItem::create_read_command(
                id(heatpump),
                esphome::modbus_controller::ModbusRegisterType::HOLDING,
                r.start, r.count, std::move(handler));
            id(heatpump)->queue_command(cmd);
          }

          // Context line so a log capture can be correlated with unit state
          // without cross-referencing Home Assistant history afterwards.
          ESP_LOGI("survey",
                   "--- sweep %u | power=%d mode=%d comp=%.0fHz fan=%.0fHz "
                   "flow=%.0f in=%.0fF out=%.0fF ---",
                   (unsigned) sweep, id(cache_power), id(cache_mode),
                   id(reg_comp_freq).has_state() ? id(reg_comp_freq).state : -1.0f,
                   id(reg_fan_freq).has_state() ? id(reg_fan_freq).state : -1.0f,
                   id(reg_fault).has_state() ? id(reg_fault).state : -1.0f,
                   id(reg_inlet_water).has_state() ? id(reg_inlet_water).state : -1.0f,
                   id(reg_outlet_water).has_state() ? id(reg_outlet_water).state : -1.0f);
